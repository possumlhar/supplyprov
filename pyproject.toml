[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "possumlhar-supplyprov"
version = "0.1.0"
description = "把候选项映射到类别上，算出供应链模型的来源验证的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "possumlhar" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://possumlhar.github.io"
Repository = "https://github.com/possumlhar/supplyprov"
Issues = "https://github.com/possumlhar/supplyprov/issues"

[project.scripts]
supplyprov = "supplyprov:main"

[tool.setuptools]
py-modules = ["supplyprov"]
